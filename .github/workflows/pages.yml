name: Deploy preview to GitHub Pages

# Client-facing preview of the NSA Cleaning site.
# Built with PREVIEW=1, so every page carries noindex and robots.txt disallows crawlers.
# The quote form is not connected here (GitHub Pages cannot run /api/quote); it shows a notice instead.
# The production build (real domain, working form) is the plain `node build.mjs` on Vercel.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build preview
        env:
          PREVIEW: '1'
          BASE_PATH: /nsa-cleaning-site
          SITE_URL: https://kauankamil-rgb.github.io/nsa-cleaning-site
        run: node build.mjs
      - name: Check internal links
        run: node scripts/check-links.mjs dist || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
